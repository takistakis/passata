[package]
name = "passata-rs"
version = "0.1.0"
authors = ["Panagiotis Ktistakis <panktist@gmail.com>"]
description = "A simple GPG-encrypted password manager"
license = "GPL-3.0-or-later"
repository = "https://github.com/takistakis/passata"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["suggestions", "color"] }
gpgme = "0.11"
libc = "0.2"
nu-ansi-term = "0.50"
pager = "0.16"
rand = "0.10"
regex = "1"
shlex = "2"
yaml-rust = "0.4"

[profile.release]
lto = "thin"
